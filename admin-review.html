<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EarnLibr | Cancelled Deal Reviews</title><style>:root{color-scheme:dark;--bg:#0a111b;--panel:#121e2d;--line:#2d4358;--text:#f1f6fb;--muted:#adbed0;--blue:#4a90e2;--green:#a3ff6e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}a{color:#b4d6f3}button,input,select{font:inherit}button{cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--green);outline-offset:2px}.wrap{max-width:1150px;margin:auto;padding:28px 20px 75px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.back{font-size:13px;text-decoration:none}.eyebrow{color:#a3d98a;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{font-size:clamp(28px,4vw,39px);letter-spacing:-.045em;margin:10px 0}p{color:var(--muted);margin:0 0 20px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:25px 0}.toolbar input{flex:1;min-width:220px;background:#142337;border:1px solid #39536a;border-radius:10px;color:white;padding:12px 14px}.count{color:#a9c4d9;font-size:12px}.list{display:grid;gap:14px}.deal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:21px}.deal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.deal h2{font-size:19px;margin:0 0 6px;letter-spacing:-.02em}.pill{border:1px solid #745e3c;background:#332719;color:#f2d7a4;border-radius:99px;padding:4px 10px;font-size:11px;white-space:nowrap}.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:16px 0}.meta div{background:#17283b;border-radius:9px;padding:10px 12px;overflow-wrap:anywhere}.meta small{display:block;color:#8eacc2;font-size:11px}.meta strong{font-size:13px;font-weight:600}.buttons{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid #44647f;border-radius:10px;background:#203a53;color:#e9f3fa;padding:10px 14px;font-weight:700;font-size:12px}.btn.primary{background:#2866a8;border-color:#538cc5}.btn.warn{background:#49322d;border-color:#82584e}.btn:disabled{opacity:.55;cursor:wait}.chat-panel{border-top:1px solid #31485d;margin-top:20px;padding-top:18px}.chat-panel[hidden]{display:none}.chat-panel h3{font-size:16px;margin:0 0 4px}.chat-note{font-size:12px;color:#a7bbcd}.messages{background:#0b1725;border:1px solid #2d4358;border-radius:12px;max-height:420px;overflow:auto;padding:15px;margin-top:12px;display:grid;align-content:start;gap:10px}.message{max-width:88%;background:#203349;border:1px solid #34536c;border-radius:12px;padding:10px 12px;overflow-wrap:anywhere}.message.provider{justify-self:end;background:#1c3a37;border-color:#34645a}.message.system{max-width:100%;justify-self:center;background:#182331;border-style:dashed}.sender{font-size:11px;color:#b6d8ee;font-weight:800}.message p{margin:5px 0 0;color:#e4eef7;white-space:pre-wrap;font-size:13px}.message time{display:block;font-size:10px;color:#a0b5c8;margin-top:6px}.empty{background:#132235;border:1px dashed #40576e;padding:25px;border-radius:12px;color:#b7c9d8}.notice{padding:12px 15px;background:#162a3d;border:1px solid #35536d;border-radius:11px;color:#d7e7f4;margin:18px 0}.notice[hidden]{display:none}.review-note{font-size:12px;color:#b5c6d4;margin:15px 0 0}@media(max-width:600px){.meta{grid-template-columns:1fr}.deal{padding:16px}.message{max-width:96%}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="admin-dashboard.html">← Admin dashboard</a><a class="back" href="admin-deals-management.html">All deals →</a></div><div class="eyebrow">Admin · Dispute resolution</div><h1>Cancelled deals awaiting review</h1><p>Inspect each deal and its recorded conversation before making a decision. Chats are read-only and should only be opened when needed for a review.</p><div id="notice" class="notice" role="status" aria-live="polite">Checking administrator access…</div><div class="toolbar"><input id="search" type="search" placeholder="Search offer, deal ID, provider or client" aria-label="Search cancelled deals"><span class="count" id="count"></span></div><div id="dealsContainer" class="list"><div class="empty">Loading cancelled deals…</div></div></main><script type="module">
import {auth,db} from "./firebase.js";
import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import {collection,query,where,getDocs,getDoc,doc,updateDoc,serverTimestamp,orderBy,limit} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";
const container=document.getElementById("dealsContainer"),notice=document.getElementById("notice"),search=document.getElementById("search"),count=document.getElementById("count");let deals=[],authorized=false,adminUid="";
const say=(msg,show=true)=>{notice.textContent=msg;notice.hidden=!show};
const fmt=t=>{try{const d=t?.toDate?t.toDate():t?new Date(t):null;return d&&!Number.isNaN(d.getTime())?d.toLocaleString():"Not available"}catch{return"Not available"}};
const val=x=>x==null||x===""?"Not available":String(x);
function meta(parent,label,value){const div=document.createElement("div"),small=document.createElement("small"),strong=document.createElement("strong");small.textContent=label;strong.textContent=val(value);div.append(small,strong);parent.append(div)}
function button(label,kind,callback){const b=document.createElement("button");b.type="button";b.className="btn "+(kind||"");b.textContent=label;if(typeof callback==="function")b.addEventListener("click",callback);return b}
function render(){container.replaceChildren();const term=search.value.trim().toLowerCase();const shown=deals.filter(({id,data})=>[id,data.offerTitle,data.providerName,data.providerId,data.clientName,data.clientId,data.promoterName].some(v=>String(v||"").toLowerCase().includes(term)));count.textContent=shown.length+" pending review"+(shown.length===1?"":"s");if(!shown.length){const e=document.createElement("div");e.className="empty";e.textContent=term?"No matching reviews.":"No cancelled deals pending review.";container.append(e);return}
for(const {id,data:d} of shown){const card=document.createElement("article");card.className="deal";const head=document.createElement("div");head.className="deal-head";const title=document.createElement("h2");title.textContent=val(d.offerTitle);const pill=document.createElement("span");pill.className="pill";pill.textContent="Needs review";head.append(title,pill);card.append(head);const metaBox=document.createElement("div");metaBox.className="meta";meta(metaBox,"Deal ID",id);meta(metaBox,"Provider",d.providerName||d.providerId);meta(metaBox,"Promoter",d.promoterName||d.promoterId);meta(metaBox,"Client",d.clientName||d.clientId);meta(metaBox,"Quantity",d.quantity||1);meta(metaBox,"Cancelled",fmt(d.cancelledAt));meta(metaBox,"Current status",d.status);if(d.note)meta(metaBox,"Deal note",d.note);if(d.cancelReason||d.cancellationReason)meta(metaBox,"Cancellation reason",d.cancelReason||d.cancellationReason);card.append(metaBox);
const controls=document.createElement("div");controls.className="buttons";const panel=document.createElement("section");panel.className="chat-panel";panel.hidden=true;const h=document.createElement("h3");h.textContent="Conversation history";const info=document.createElement("p");info.className="chat-note";info.textContent="Read-only messages associated with this deal. Check the conversation before deciding.";const msgs=document.createElement("div");msgs.className="messages";panel.append(h,info,msgs);
const view=button("View conversation","","");view.addEventListener("click",async()=>{if(!panel.hidden){panel.hidden=true;view.textContent="View conversation";return}panel.hidden=false;view.textContent="Hide conversation";msgs.textContent="Loading conversation…";try{const ref=doc(db,"chats",id);const snap=await getDoc(ref);if(!snap.exists()){msgs.textContent="No conversation record found for this deal.";return}const q=query(collection(db,"chats",id,"messages"),orderBy("createdAt","asc"),limit(300));const result=await getDocs(q);msgs.replaceChildren();if(result.empty){msgs.textContent="No messages recorded.";return}result.forEach(m=>{const data=m.data();const row=document.createElement("div");row.className="message "+(["provider","system"].includes(data.sender)?data.sender:"");const sender=document.createElement("div");sender.className="sender";sender.textContent=data.sender==="provider"?"Provider":data.sender==="client"?"Client":data.sender==="system"?"System":val(data.sender);const body=document.createElement("p");body.textContent=data.deleted?"[Message deleted]":data.text||((data.imageUrl||data.mediaUrl||data.fileUrl)?"Media attachment (open original chat for file)":"Message without text");const time=document.createElement("time");time.textContent=fmt(data.createdAt||data.timestamp);row.append(sender,body,time);msgs.append(row)});if(result.size===300){const more=document.createElement("p");more.textContent="Showing the first 300 messages. Longer conversations need further review.";msgs.append(more)}}catch(e){console.error(e);msgs.textContent=e.code==="permission-denied"?"Access denied by chat permissions. Ask a developer to check the existing admin read policy; do not change permissions for public users.":"Could not load conversation: "+val(e.message)}});controls.append(view);
const approve=button("Approve cancellation","primary",()=>review("approved",approve));const dispute=button("Flag as disputed","warn",()=>review("disputed",dispute));controls.append(approve,dispute);card.append(controls,panel);
async function review(action,buttonEl){if(!authorized)return;const verb=action==="approved"?"approve this cancellation":"flag this cancellation as disputed";if(!confirm("Do you want to "+verb+"? This records a review decision and does not settle or restore payments."))return;approve.disabled=dispute.disabled=true;try{const ref=doc(db,"cancelled-deals",id);const latest=await getDoc(ref);if(!latest.exists()||latest.data().reviewRequired!==true)throw Error("This review is no longer pending. Refresh the page.");const patch=action==="approved"?{reviewRequired:false,reviewDecision:"approved",reviewedBy:adminUid,reviewedAt:serverTimestamp()}:{reviewRequired:false,status:"disputed",reviewDecision:"disputed",reviewedBy:adminUid,reviewedAt:serverTimestamp()};await updateDoc(ref,patch);deals=deals.filter(x=>x.id!==id);say(action==="approved"?"Cancellation review approved.":"Deal flagged as disputed for follow-up.");render()}catch(e){console.error(e);say("Could not save review: "+val(e.message));approve.disabled=dispute.disabled=false}}container.append(card)}
}
search.addEventListener("input",render);
onAuthStateChanged(auth,async user=>{if(!user||!user.emailVerified){location.replace("login.html");return}try{let role="";const u=await getDoc(doc(db,"users",user.uid));if(u.exists())role=u.data().role||"";else{const a=await getDoc(doc(db,"admins",user.uid));if(a.exists())role=a.data().role||"admin"}if(!["admin","super_admin"].includes(role)){say("Administrator access required.");container.textContent="You do not have access to these reviews.";return}authorized=true;adminUid=user.uid;const snapshot=await getDocs(query(collection(db,"cancelled-deals"),where("reviewRequired","==",true)));deals=snapshot.docs.map(s=>({id:s.id,data:s.data()}));say("",false);render()}catch(e){console.error(e);say("Unable to load reviews: "+val(e.message));container.textContent="Please check your access and try again."}});
</script></body></html>
