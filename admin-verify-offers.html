<!DOCTYPE html>        
<html lang="en">        
<head>        
<meta charset="UTF-8">        
<meta name="viewport" content="width=device-width, initial-scale=1.0">        
<title>EarnLibr — Admin Verify Offers</title>        

<style>        
  body { font-family: Arial, sans-serif; background:#0b0d17; color:#eef2f7; margin:0; padding:20px;}        
  h1 { background: linear-gradient(90deg,#4a90e2,#a3ff6e); -webkit-background-clip:text; color:transparent; }        

  .offer-card {        
    background:#0f1724; border-radius:12px; padding:15px; margin-bottom:15px;        
    display:flex; gap:15px; align-items:flex-start; position:relative;        
    transition: opacity 0.3s ease;        
  }        
  .offer-card img {        
    width:120px; height:80px; object-fit:cover; border-radius:8px;        
    transition: transform 0.2s ease; cursor:pointer;        
  }        
  .offer-card img:hover { transform: scale(2); z-index: 10; position: relative; }        

  .offer-details { flex:1; line-height:1.4; }        
  .offer-actions button { margin-right:8px; padding:6px 12px; border:none; border-radius:8px; cursor:pointer; font-weight:700;}        
  .approve { background:#4ade80; color:#041018; }        
  .reject { background:#ef4444; color:#fff; }        

  .notification {        
    position: absolute;        
    top:5px; right:5px;        
    padding:6px 12px;        
    border-radius:8px;        
    font-size:0.9rem;        
    font-weight:700;        
    opacity:0.9;        
  }        
  .notification.success { background:#4ade80; color:#041018; }        
  .notification.error { background:#ef4444; color:#fff; }        
  .notification.info { background:#3b82f6; color:#fff; }        

  .unauthorized { color: #ef4444; text-align: center; padding: 50px; }        

*{box-sizing:border-box}body{font-family:Inter,system-ui,Arial;background:#0b121c;color:#edf3fa;max-width:1250px;margin:auto;padding:clamp(16px,3vw,36px)}
.review-header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.review-header h1{background:none;-webkit-background-clip:initial;color:#f4f8fc;font-size:clamp(28px,4vw,38px);letter-spacing:-.035em;margin:6px 0}.review-header p{font-size:14px;color:#a8b9cb;margin:0}.eyebrow{color:#94b7d0;letter-spacing:.15em;font-size:11px;font-weight:750}.back-link{color:#c8dbe9;text-decoration:none;border:1px solid #37516a;border-radius:10px;padding:10px 14px}
.review-toolbar{display:flex;gap:12px;align-items:center;background:#121f2e;border:1px solid #2c4054;padding:13px;border-radius:14px;margin-bottom:20px}.review-toolbar input{flex:1;min-width:0;background:#0d1927;border:1px solid #3a536c;border-radius:10px;color:#f1f7fb;padding:12px;font-size:14px}.review-toolbar span{font-size:12px;color:#aabed0}
.offer-card{display:grid;grid-template-columns:170px minmax(0,1fr) 140px;gap:20px;background:#121f2e;border:1px solid #2b4054;border-radius:18px;padding:18px;box-shadow:none;align-items:start}.offer-card:hover{border-color:#496782}.review-image{min-height:145px;background:#1a2b3d;border:1px solid #30465a;border-radius:12px;display:grid;place-items:center;color:#a5b7c8;font-size:12px;overflow:hidden}.review-image img{width:100%;height:145px;object-fit:cover;border-radius:0;cursor:default}.review-image img:hover{transform:none}.offer-details h2{font-size:19px;margin:10px 0;letter-spacing:-.02em}.review-topline{display:flex;justify-content:space-between;gap:10px}.review-category{font-size:11px;background:#22384c;color:#bed5e8;border-radius:99px;padding:4px 10px}.review-date{font-size:11px;color:#9ab0c5}.review-description{color:#b2c2d3;font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.review-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.review-metrics>div{background:#0d1927;border:1px solid #293d50;border-radius:10px;padding:10px}.review-metrics small{display:block;color:#9eb1c5;font-size:11px}.review-metrics strong{display:block;color:#eef4fa;margin-top:4px;font-size:14px}.review-more{font-size:12px;color:#aec0d0;margin-top:14px}.review-more summary{cursor:pointer;color:#b7d1e5}.review-more p{overflow-wrap:anywhere}
.offer-actions{display:flex;flex-direction:column;gap:9px}.offer-actions button{margin:0;min-height:44px;padding:10px;border-radius:10px;border:1px solid #486b86;font-size:13px}.approve{background:#305570;color:#f2f7fb}.reject{background:#2a2530;color:#edc6cc;border-color:#62444e!important}.offer-actions button:disabled{opacity:.55;cursor:wait}.notification{position:relative;grid-column:1/-1;top:auto;right:auto;opacity:1;font-size:12px;font-weight:600;border-radius:10px;padding:11px}.notification.success{background:#17372d;color:#b8e4ce}.notification.error{background:#3b252d;color:#ffd6da}.notification.info{background:#20364c;color:#d6eafb}.review-empty{padding:36px;text-align:center;color:#b6c7d7;background:#121f2e;border:1px solid #30465a;border-radius:15px}
@media(max-width:850px){.offer-card{grid-template-columns:135px 1fr}.offer-actions{grid-column:1/-1;flex-direction:row}.offer-actions button{flex:1}}@media(max-width:560px){.offer-card{display:block}.review-image{margin-bottom:15px}.review-image img{height:180px}.offer-actions{margin-top:15px}.review-toolbar{flex-wrap:wrap}.review-toolbar input{flex-basis:100%}}
</style>        
</head>        
<body>        

<header class="review-header"><div><span class="eyebrow">EARNLIBR / ADMIN</span><h1>Offer review</h1><p>Check submissions before publishing them to the marketplace.</p></div><a href="admin-dashboard.html" class="back-link">Dashboard</a></header><div class="review-toolbar"><input id="offerSearch" type="search" placeholder="Search offers, categories or providers" aria-label="Search pending offers"><span id="pendingCount"></span></div>        
<div id="offersContainer">Loading...</div>        

<script type="module">        
import { db, auth } from './firebase.js';        
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";        
import {         
  collection, doc, getDoc, getDocs, setDoc, deleteDoc, serverTimestamp,
  runTransaction, writeBatch // UPGRADE: Added runTransaction and writeBatch
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";        

const offersContainer = document.getElementById('offersContainer');        
const ADMIN_ROLES = ['admin', 'super_admin'];        
let userSession = null; let pendingSnapshots=[];\nconst searchField=document.getElementById("offerSearch");\nsearchField.addEventListener("input",renderPendingList);\nconst escapeHtml=v=>String(v??"").replace(/[&<>]/g,c=>c==="&"?"&amp;":c==="<"?"&lt;":"&gt;");        

// ================== UTILITY FUNCTIONS ==================        
function showNotification(card, message, type='info', duration=3000) {        
  const notif = document.createElement('div');        
  notif.className = `notification ${type}`;        
  notif.innerText = message;        
  card.appendChild(notif);        
  setTimeout(() => notif.remove(), duration);        
}        

// UPGRADE: Uses writeBatch for efficient, atomic notification sending
async function sendNotifications(providerId, title, message) {
  try {
    const batch = writeBatch(db);
    batch.set(doc(collection(db, `notifications/${providerId}/items`)), {
      title,
      message,
      createdAt: serverTimestamp(),
      read: false
    });
    await batch.commit();
  } catch(err) {
    console.error("Batch notification error:", err);
  }
}

async function getProviderInfo(providerId) {        
  // NOTE: This runs outside the transaction as a pre-fetch of static data
  const userDoc = await getDoc(doc(db, "providers", providerId));        
  return userDoc.exists() ? userDoc.data() : null;        
}        

function handleUnauthorized(message) {        
  offersContainer.innerHTML = `<div class="unauthorized">❌ ${message} Redirecting to login...</div>`;        
  localStorage.removeItem('userSession');        
  setTimeout(() => window.location.href = 'login.html', 2000);        
}        

// ================== AUTH & SESSION (unchanged) ==================        
const sessionRaw = localStorage.getItem('userSession');        
if (sessionRaw) userSession = JSON.parse(sessionRaw);        

onAuthStateChanged(auth, async (user) => {        
  if (!user) return handleUnauthorized("You are not logged in.");        

  try {        
    const adminDoc = await getDoc(doc(db, "admins", user.uid));        
    if (!adminDoc.exists()) return handleUnauthorized("Admin record not found.");        

    const userData = adminDoc.data();        
    const role = userData.role || 'admin';        
    if (!ADMIN_ROLES.includes(role)) return handleUnauthorized(`Unauthorized role: ${role}.`);        

    userSession = {        
      uid: user.uid,        
      role,        
      name: userData.name || user.email,        
      email: user.email        
    };        
    localStorage.setItem('userSession', JSON.stringify(userSession));        

    loadPendingOffers();        

  } catch (err) {        
    handleUnauthorized("Auth verification failed: " + err.message);        
  }        
});        

// ================== LOAD PENDING OFFERS (unchanged) ==================        
async function loadPendingOffers(){
 offersContainer.textContent="Loading pending offers…";
 try{
  const snapshot=await getDocs(collection(db,"offers_pending"));
  pendingSnapshots=snapshot.docs;
  renderPendingList();
 }catch(e){console.error(e);offersContainer.textContent="Unable to load offers. Check your connection and refresh.";}
}
function renderPendingList(){
 const q=searchField.value.trim().toLowerCase();
 const matches=pendingSnapshots.filter(d=>[d.data().title,d.data().providerId,d.data().category].some(v=>String(v||"").toLowerCase().includes(q)));
 document.getElementById("pendingCount").textContent=matches.length+" pending";
 offersContainer.replaceChildren();
 if(!matches.length){offersContainer.innerHTML='<div class="review-empty">No pending offers match your search.</div>';return}
 matches.sort((a,b)=>(a.data().createdAt?.seconds||0)-(b.data().createdAt?.seconds||0)).forEach(renderOfferCard);
}
// ================== RENDER OFFER CARD ==================        
function renderOfferCard(docSnap) {        
  const offer = docSnap.data();        
  const offerId = docSnap.id;        
  const providerId = offer.providerId;        

  const card = document.createElement('div');        
  card.className = 'offer-card';        
  card.id = `offer-${offerId}`;        
  const image = typeof offer.imageTemp==="string" && (offer.imageTemp.startsWith("data:image/")||offer.imageTemp.startsWith("https://"))?offer.imageTemp:"";
  card.innerHTML = `
    <div class="review-image">${image?'<img alt="Offer image">':'No image supplied'}</div>
    <div class="offer-details">
      <div class="review-topline"><span class="review-category">${escapeHtml(offer.category||'Uncategorized')}</span><span class="review-date">${offer.createdAt?.toDate?.()?.toLocaleDateString()||'Date unavailable'}</span></div>
      <h2>${escapeHtml(offer.title||'Untitled offer')}</h2>
      <p class="review-description">${escapeHtml(offer.description||'No description supplied')}</p>
      <div class="review-metrics">
        <div><small>Price</small><strong>${escapeHtml(offer.currency||'$')} ${escapeHtml(offer.price??0)}</strong></div>
        <div><small>Commission</small><strong>${escapeHtml(offer.commissionValue??0)}${offer.commissionType==='percentage'?'%':' '+escapeHtml(offer.currency||'')}</strong></div>
        <div><small>Available</small><strong>${escapeHtml(offer.totalProducts??0)}</strong></div>
        <div><small>Promotion budget</small><strong>${escapeHtml(offer.promotionBudget??0)}</strong></div>
      </div>
      <details class="review-more"><summary>More details</summary><p>Provider ID: ${escapeHtml(providerId||'Unknown')}</p><p>Commission type: ${escapeHtml(offer.commissionType||'Not specified')}</p><p>Promotion spent: ${escapeHtml(offer.promoSpent??0)}</p></details>
    </div>
    <div class="offer-actions"><button class="approve" type="button">Approve offer</button><button class="reject" type="button">Reject</button></div>
  `;
  if(image)card.querySelector(".review-image img").src=image;
  const approveBtn = card.querySelector('.approve');        
  const rejectBtn = card.querySelector('.reject');        

  approveBtn.onclick = () => approveOffer(card, offer, offerId, providerId);        
  rejectBtn.onclick = () => rejectOffer(card, offer, offerId, providerId);        

  offersContainer.appendChild(card);        
}        

// ================== APPROVE OFFER ==================        
async function approveOffer(card, offer, offerId, providerId) {        
  const pendingRef = doc(db, "offers_pending", offerId);
  const approveBtn = card.querySelector('.approve');        
  const rejectBtn = card.querySelector('.reject');        
  approveBtn.disabled = true;        
  rejectBtn.disabled = true;        
  showNotification(card, "Processing approval...", "info");        

  // CRITICAL UPGRADE: SOFT LOCK TRANSACTION
  try {
    await runTransaction(db, async (t) => {
      const snap = await t.get(pendingRef);
      if (!snap.exists()) throw new Error("Offer not found or already processed.");
      if (snap.data().status === "processing") throw new Error("Offer is currently being processed.");
      
      // Update status to 'processing' to block concurrent operations
      t.update(pendingRef, { status: "processing" }); 
    });
  } catch (err) {
    if (err.message.includes("being processed")) {
      showNotification(card, "Offer is currently being processed.", "error");
      return;
    }
    showNotification(card, `Lock failure: ${err.message}`, "error");
    return; 
  }

  let approvalCommitted = false; // Main Approval Logic (Image Upload & Database Transaction)
  try {        
    const providerInfo = await getProviderInfo(providerId); // Pre-fetch provider info      
    let cloudUrl = null;        

    // Image Upload (Cloudinary)
    if (offer.imageTemp) {        
      // NOTE: Assumes offer.imageTemp is a Base64 string from the client
      const formData = new FormData();        
      formData.append('file', offer.imageTemp);        
      formData.append('upload_preset', 'Earnlibr');        

      const res = await fetch('https://api.cloudinary.com/v1_1/dye3bda08/image/upload', { method: 'POST', body: formData });        
      const data = await res.json();        
      cloudUrl = data.secure_url;        
    }        

    const approvedOffer = {        
      ...offer,        
      providerId,        
      providerName: providerInfo?.name || "Unknown",        
      providerEmail: providerInfo?.email || "",        
      providerPhone: providerInfo?.phone || "+000000000",        
      role: providerInfo?.role || "provider",        
      imageUrl: cloudUrl || offer.imageUrl || null,        
      status: "active",        
      verified: true,        
      verifiedBy: userSession.role,        
      approvedAt: serverTimestamp(), // UPGRADE: Use serverTimestamp()
      promoSpent: offer.promoSpent || 0,        
      amountOwed: 0,
      amountPaid: 0,        
      outstandingBalance: 0,        
      paymentStatus: 'unpaid',        
      paymentDeadline: null,        
      nextBillingDate: null,        
      lastBilledAt: null,        
      paymentNotes: '',        
      providerStats: { totalDeals: 0, completedDeals: 0, cancelledDeals: 0 },        
      totalDealsGenerated: 0,        
      totalDealsCompleted: 0,        
      totalEarned: 0,        
      clicks: 0,        
      leads: 0,        
      sales: 0,        
      uniqueLink: ""        
    };        

    // Database Transaction
    await runTransaction(db, async (t) => {
      // Move pending offer to live collections and delete the pending document
      t.set(doc(db, "offers_all", offerId), approvedOffer);        
      t.set(doc(db, `providers/${providerId}/offers/${offerId}`), approvedOffer);        
      t.delete(pendingRef); 
    });

    // The backend validates admin identity and the approved offer before queuing alerts.
    let broadcastQueued = false;
    try {
      const token = await auth.currentUser.getIdToken();
      const response = await fetch('https://earnlibr-core-api.www-sandicarrew.workers.dev/v1/promoters/offer-approved', {
        method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ offerId })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.success) throw new Error(result.error || 'Notification queue unavailable');
      broadcastQueued = true;
    } catch (pushError) {
      console.error('Promoter notification queue failed:', pushError);
      showNotification(card, 'Offer is live, but promoter alerts could not be queued. Retry notification delivery later.', 'error', 8000);
    }

    await sendNotifications(providerId, "Offer Approved ✅", `Your offer "${offer.title}" has been approved and is now live.`);

    showNotification(card, broadcastQueued ? "Offer approved. Promoter notifications queued!" : "Offer approved, but push alerts were not queued.", broadcastQueued ? "success" : "error", 6000);        
    card.style.opacity = "0";        
    setTimeout(() => card.remove(), 300);        

  } catch (err) {        
    console.error(err);        
    // CRITICAL UPGRADE: Rollback status if transaction or Cloudinary fails
    if (!approvalCommitted) await setDoc(pendingRef, { status: "pending" }, { merge: true }).catch(e => console.error("Failed to reset status:", e));
    showNotification(card, "Error: " + err.message, "error");        
    approveBtn.disabled = false;        
    rejectBtn.disabled = false;        
  }        
}        

// ================== REJECT OFFER ==================        
async function rejectOffer(card, offer, offerId, providerId) {        
  if (!confirm("Are you sure you want to reject this offer?")) return;        
  const approveBtn = card.querySelector('.approve');        
  const rejectBtn = card.querySelector('.reject');        
  approveBtn.disabled = true;        
  rejectBtn.disabled = true;        
  showNotification(card, "Rejecting offer...", "info");        

  try {        
    await deleteDoc(doc(db, "offers_pending", offerId));        
    
    // UPGRADE: Use batch notifications
    await sendNotifications(providerId, "Offer Rejected ❌", `Your offer "${offer.title}" was rejected. Please review and resubmit.`);

    showNotification(card, "Offer rejected and provider notified.", "error");        
    card.style.opacity = "0";        
    setTimeout(() => card.remove(), 300);        
  } catch (err) {        
    console.error(err);        
    showNotification(card, "Error: " + err.message, "error");        
    approveBtn.disabled = false;        
    rejectBtn.disabled = false;        
  }        
}        
</script>        
</body>        
</html>
